<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Akash Data Science Portfolio</title>
    <style>
        body {
            background-color: azure;
        }

        .navbar-custom {
            background-color: skyblue;
        }

        header {
            background-color: #ffffff;
            color: #005A91;
            padding: 20px;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .content {
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            background-color: #0079BF;
            color: #ff6f61;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.2rem;
            margin: 10px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #005A91;
        }

        .footer {
            background-color: #34495e;
            color: #fff;
            padding: 10px;
            text-align: center;
            margin-top: auto;
            bottom: 0;
            width: 100%;
        }

        .navbar-nav .nav-link {
            color: #ff6f61;
            padding: 10px 15px;
            transition: background-color 0.3s ease;
        }

        .navbar-nav .nav-link:hover,
        .navbar-nav .nav-link.active {
            background-color: #4d6275;
            border-radius: 5px;
        }

        footer {
            position: fixed !important;
            bottom: 0 !important;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-custom">
            <div class="container-fluid">
                <a class="navbar-brand" href="/" style="font-family: cursive;">Akash Data Mining Portfolio</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="/">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Projects.html">Projects</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div class="container">
            <div class="content">
                <h1>Data Mining Projects</h1>
                <p>Located in the projects page.</p>
                <a class="btn" href="Projects.html">View Projects</a>
            </div>
        </div>
    </main>
    <footer class="footer">
        <p>&copy; 2024 Akash Data Science Portfolio</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
<div class="wave-box">
    <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
        <defs>
            <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z"/>
        </defs>
        <g class="parallax">
            <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(2, 158, 235, 0.7"/>
            <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(2, 158, 235, 0.5)"/>
            <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(2, 158, 235, 0.2)"/>
            <use xlink:href="#gentle-wave" x="48" y="7" fill="#029eeb"/>
        </g>
    </svg>
</div>
</html>
